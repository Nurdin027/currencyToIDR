<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
<div class="container">

    <div class="card card-body mt-5">
        <h3 class="mb-5">Extension Configuration</h3>

        <div class="row">
            <div class="col">
                <div class="mb-3">
                    <label for="exchangerate" class="form-label">Exchangerate Key:</label>
                    <input class="form-control form-control-sm" id="exchangerate">
                    <div class="form-text">Doesn't have an Exchangerate Key?
                        <a style="width: 10%" target="_blank" href="https://www.exchangerate-api.com/">
                            Register Here</a>
                    </div>
                </div>
            </div>
            <div class="col align-content-center">
                <p>Usage Count: <span id="exchangerateCount">0</span> time(s)</p>
            </div>
        </div>
        <h4>For Backup</h4>
        <div class="row">
            <div class="col">
                <div class="mb-3">
                    <label for="currencyfreaks" class="form-label">Currencyfreaks Key:</label>
                    <input class="form-control form-control-sm" id="currencyfreaks">
                    <div class="form-text">
                        Doesn't have an Currencyfreaks Key?
                        <a style="width: 10%" target="_blank" href="https://currencyfreaks.com/">Register Here</a>
                    </div>
                </div>
            </div>
            <div class="col align-content-center">
                <p>Usage Count: <span id="currencyfreaksCount">0</span> time(s)</p>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="mb-3">
                    <label for="popupTimeout" class="form-label">Popup Timeout:</label>
                    <div class="input-group input-group-sm mb-3">
                        <input class="form-control form-control-sm" id="popupTimeout" value="10000">
                        <span class="input-group-text"> ms</span>
                    </div>
                    <div class="form-text">
                        Default: <a target="_blank"
                                    href="https://www.dollartimes.com/calculate/time/milliseconds/seconds/10000">
                        10000 ms</a>
                    </div>
                </div>
            </div>
            <div class="col align-content-center"></div>
        </div>
        <button id="save" class="btn btn-secondary">Save</button>
        <div id="alert" class="alert alert-info alert-dismissible fade" role="alert">
            Config saved!
        </div>
    </div>
</div>
<script src="options.js"></script>

</body>
</html>
